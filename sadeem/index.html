<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SADEEM Hangar</title>
<meta name="description" content="SADEEM Innovates · the single national entry point for high-sensitivity innovation, as a sovereign virtual innovation hangar and the SADEEM OS behind it.">
<meta name="theme-color" content="#F5F2EA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 1 18.2 13.8 31 16 18.2 18.2 16 31 13.8 18.2 1 16 13.8 13.8Z' fill='%23C8A45C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600&display=swap">
<script>
  // language + theme before first paint, so nothing flips after load
  try {
    var l = localStorage.getItem("sadeem_lang") || "ar";
    document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    var th = localStorage.getItem("sadeem_theme"); if (th) document.documentElement.dataset.theme = th;
  } catch (e) {}
</script>
</head>
<body>
<noscript>SADEEM Hangar needs JavaScript to open the facility.</noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
